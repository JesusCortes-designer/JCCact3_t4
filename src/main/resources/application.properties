spring.application.name=demoCrud

# Puerto: 8080 en local. En el VPS se cambia con la variable SERVER_PORT (ej. 8083)
server.port=${SERVER_PORT:8080}

# Base de datos MySQL: los valores tras ":" son los de tu PC local.
# En el VPS se definen las variables de entorno DB_URL, DB_USER y DB_PASS
# (así no subes credenciales reales al repositorio).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/act3_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:cambia_esto}

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
