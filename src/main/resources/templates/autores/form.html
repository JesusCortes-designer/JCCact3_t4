<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav>
    <span class="brand">Biblioteca · Act 3</span>
    <a th:href="@{/libros}">Libros</a>
    <a th:href="@{/autores}">Autores</a>
</nav>
<main>
    <div class="card">
        <h1 th:text="${titulo}">Autor</h1>
        <div class="msg error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{${accion}}" th:object="${autor}" method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required>

            <label for="nacionalidad">Nacionalidad</label>
            <input id="nacionalidad" type="text" th:field="*{nacionalidad}">

            <div class="actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn gray" th:href="@{/autores}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
